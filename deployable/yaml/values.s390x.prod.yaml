image:
  repository: quay.io/tonyfieit75/flink-kubernetes-operator
  tag: "s390x-1.13"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 1

strategy:
  type: Recreate

webhook:
  enabled: false
  resources: {}

rbac:
  create: true
  nodesRule:
    create: false
  operatorRole:
    create: true
    name: "flink-operator"
  operatorRoleBinding:
    create: true
    name: "flink-operator-role-binding"
  jobRole:
    create: true
    name: "flink"
  jobRoleBinding:
    create: true
    name: "flink-role-binding"

operatorPod:
  nodeSelector:
    kubernetes.io/arch: s390x
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "flink"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

